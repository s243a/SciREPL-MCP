name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  broker-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/broker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/broker/package-lock.json
      - run: npm ci --omit=optional
      - run: npm run check
      - run: npm run test:node-pty-support
      - run: npm run test:setup
      - run: npm run test:security
      - run: npm run test:unmanaged
      - run: npm run test:broker
      - run: npm run test:missing-agent

  broker-terminal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/broker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/broker/package-lock.json
      - run: npm ci
      - run: npm ls node-pty
      - run: npm run test:node-pty-support
      - run: npm run test:term
        env:
          REQUIRE_PTY: "1"
      - run: npm run test:setup

  playwright-driver:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/playwright-driver
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/playwright-driver/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  playwright-browser-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/playwright-driver
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/playwright-driver/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/broker/package-lock.json
            packages/playwright-driver/package-lock.json
      - run: npm ci --omit=optional
        working-directory: packages/broker
      - run: npm audit --omit=dev --audit-level=moderate
        working-directory: packages/broker
      - run: npm ci
        working-directory: packages/playwright-driver
      - run: npm audit --omit=dev --audit-level=moderate
        working-directory: packages/playwright-driver
